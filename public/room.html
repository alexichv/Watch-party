<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WatchParty — Room</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="filmstrip"></div>
    <header class="topbar">
      <div class="room-info">
        🎬 <span id="roomLabel"></span>
        <button id="copyLinkBtn" title="Copier le lien d'invitation">🔗 Copier le lien</button>
      </div>
      <div class="controls">
        <button id="toggleCamBtn" class="off">📷 Activer la caméra</button>
        <button id="toggleMicBtn" class="off">🎤 Activer le micro</button>
        <button id="castBtn">📺 Caster</button>
        <label id="uploadLabel" class="uploadLabel" style="display:none">
          📁 Choisir une vidéo
          <input type="file" id="videoFileInput" accept="video/*" hidden />
        </label>
        <span id="hostBadge" class="host-badge" style="display:none">👑 Tu es l'hôte</span>
      </div>
    </header>

    <main class="main">
      <section class="video-area">
        <div id="uploadStatus"></div>
        <video id="mainVideo" controls></video>
        <div id="reactionsLayer" class="reactions-layer"></div>
      </section>

      <aside class="side-panel">
        <div class="playlist-panel">
          <div class="playlist-header">🎞️ Playlist</div>
          <div id="playlistItems" class="playlist-items"></div>
        </div>

        <div id="videoGrid" class="video-grid"></div>

        <div class="chat">
          <div id="chatMessages" class="chat-messages"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" placeholder="Écris un message..." autocomplete="off" />
            <div class="emoji-wrapper">
              <button type="button" id="emojiToggleBtn" title="Réactions">😀</button>
              <div id="emojiPicker" class="emoji-picker hidden">
                <button type="button" class="reaction-btn" data-emoji="😂">😂</button>
                <button type="button" class="reaction-btn" data-emoji="😍">😍</button>
                <button type="button" class="reaction-btn" data-emoji="😱">😱</button>
                <button type="button" class="reaction-btn" data-emoji="👏">👏</button>
                <button type="button" class="reaction-btn" data-emoji="🔥">🔥</button>
                <button type="button" class="reaction-btn" data-emoji="😢">😢</button>
                <button type="button" class="reaction-btn" data-emoji="❤️">❤️</button>
              </div>
            </div>
            <button type="submit">Envoyer</button>
          </form>
        </div>
      </aside>
    </main>
    <div class="filmstrip"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <script src="app.js"></script>
</body>
</html>
